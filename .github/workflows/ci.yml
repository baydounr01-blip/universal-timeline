name: bateria-de-falsacion

on:
  push:
  pull_request:

jobs:
  falsacion:
    name: "tests + experimentos (py${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar el paquete
        run: pip install -e ".[test]"
      - name: Coherencia interna (P1-P12)
        run: pytest -q
      - name: Bateria de falsacion (E1-E6)
        run: bbu-verify
